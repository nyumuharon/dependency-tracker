<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">How dep-tracker scores risk</title>
  <desc id="desc">Each advisory gets a severity score from the first available source, is then placed in a tier by the first matching rule, and a package takes the tier of its most severe advisory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .panel { font-size: 15px; font-weight: 700; }
      .text { font-size: 12.5px; fill: #475569; }
      .strong { font-size: 13px; font-weight: 600; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .rule { font-size: 13px; fill: #0f172a; }
      .tier { font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="560" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="title" x="32" y="46">Risk scoring</text>
  <text class="subtitle" x="32" y="72">Severity and real-world exploitation decide the tier; a missing score is never treated as low risk</text>

  <!-- Severity sources -->
  <rect x="32" y="100" width="330" height="420" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="panel" x="52" y="132">1 · Severity score per advisory</text>
  <text class="text" x="52" y="156">The first source that has one is used</text>

  <rect x="52" y="174" width="290" height="62" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <circle cx="74" cy="205" r="11" fill="#7c3aed"/><text class="num" x="74" y="209" text-anchor="middle">1</text>
  <text class="strong" x="96" y="200">CVSS vector in the advisory</text>
  <text class="text" x="96" y="220">v3.0 / v3.1, computed locally</text>

  <rect x="52" y="246" width="290" height="62" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <circle cx="74" cy="277" r="11" fill="#7c3aed"/><text class="num" x="74" y="281" text-anchor="middle">2</text>
  <text class="strong" x="96" y="272">NIST NVD base score</text>
  <text class="text" x="96" y="292">v3.1, v4.0, v3.0 or v2; cached 24 h</text>

  <rect x="52" y="318" width="290" height="62" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <circle cx="74" cy="349" r="11" fill="#7c3aed"/><text class="num" x="74" y="353" text-anchor="middle">3</text>
  <text class="strong" x="96" y="344">Advisory database rating</text>
  <text class="text" x="96" y="364">critical 9.0 · high 7.0 · moderate 4.0 · low 0.1</text>

  <rect x="52" y="390" width="290" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <circle cx="74" cy="421" r="11" fill="#64748b"/><text class="num" x="74" y="425" text-anchor="middle">–</text>
  <text class="strong" x="96" y="416">No score anywhere</text>
  <text class="text" x="96" y="436">Shown as unknown, never as 0.0</text>

  <text class="text" x="52" y="484">EPSS (FIRST, 30-day exploitation probability)</text>
  <text class="text" x="52" y="503">and CISA KEV listing are joined by CVE ID</text>

  <line x1="362" y1="310" x2="390" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rules -->
  <rect x="394" y="100" width="560" height="420" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="panel" x="414" y="132">2 · Advisory tier</text>
  <text class="text" x="414" y="156">The first matching rule wins</text>

  <g>
    <rect x="414" y="172" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="201">Listed in the CISA KEV catalog</text>
    <rect x="726" y="182" width="192" height="28" rx="14" fill="#b91c1c"/>
    <text class="tier" x="822" y="200" text-anchor="middle">CRITICAL-EXPLOITABLE</text>
  </g>
  <g>
    <rect x="414" y="228" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="257">Score ≥ 7.0 and EPSS ≥ 0.20</text>
    <rect x="726" y="238" width="192" height="28" rx="14" fill="#b91c1c"/>
    <text class="tier" x="822" y="256" text-anchor="middle">CRITICAL-EXPLOITABLE</text>
  </g>
  <g>
    <rect x="414" y="284" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="313">Score ≥ 7.0</text>
    <rect x="726" y="294" width="192" height="28" rx="14" fill="#ea580c"/>
    <text class="tier" x="822" y="312" text-anchor="middle">HIGH</text>
  </g>
  <g>
    <rect x="414" y="340" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="369">Score 4.0 – 6.9</text>
    <rect x="726" y="350" width="192" height="28" rx="14" fill="#ca8a04"/>
    <text class="tier" x="822" y="368" text-anchor="middle">MEDIUM</text>
  </g>
  <g>
    <rect x="414" y="396" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="425">Score above 0 and below 4.0</text>
    <rect x="726" y="406" width="192" height="28" rx="14" fill="#2563eb"/>
    <text class="tier" x="822" y="424" text-anchor="middle">LOW</text>
  </g>
  <g>
    <rect x="414" y="452" width="520" height="48" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text class="rule" x="432" y="481">No score from any source</text>
    <rect x="726" y="462" width="192" height="28" rx="14" fill="#64748b"/>
    <text class="tier" x="822" y="480" text-anchor="middle">UNKNOWN</text>
  </g>

  <line x1="954" y1="310" x2="982" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Package tier -->
  <rect x="986" y="100" width="262" height="420" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="panel" x="1006" y="132">3 · Package tier and exit</text>

  <text class="strong" x="1006" y="170">Most severe advisory wins</text>
  <text class="text" x="1006" y="190">A package with findings keeps its</text>
  <text class="text" x="1006" y="208">tier even if another check failed</text>

  <rect x="1006" y="228" width="80" height="26" rx="13" fill="#16a34a"/>
  <text class="tier" x="1046" y="245" text-anchor="middle">NONE</text>
  <text class="text" x="1096" y="245">no advisories and</text>
  <text class="text" x="1096" y="263">all checks complete</text>

  <rect x="1006" y="282" width="80" height="26" rx="13" fill="#64748b"/>
  <text class="tier" x="1046" y="299" text-anchor="middle">UNKNOWN</text>
  <text class="text" x="1096" y="299">no advisories, but a</text>
  <text class="text" x="1096" y="317">check did not finish</text>

  <line x1="1006" y1="340" x2="1228" y2="340" stroke="#a7f3d0"/>

  <text class="strong" x="1006" y="368">Exit code for CI</text>
  <text class="strong" x="1006" y="396">2</text>
  <text class="text" x="1028" y="396">any check incomplete or</text>
  <text class="text" x="1028" y="414">version unresolved</text>
  <text class="strong" x="1006" y="442">1</text>
  <text class="text" x="1028" y="442">otherwise, any package</text>
  <text class="text" x="1028" y="460">CRITICAL-EXPLOITABLE</text>
  <text class="strong" x="1006" y="488">0</text>
  <text class="text" x="1028" y="488">everything else</text>
</svg>
