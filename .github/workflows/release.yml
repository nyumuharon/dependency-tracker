name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Build standalone binaries
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            dist/dep-tracker-linux-amd64
            dist/dep-tracker-linux-arm64
            dist/dep-tracker-windows-amd64.exe
            dist/dep-tracker-macos-amd64
            dist/dep-tracker-macos-arm64
            dist/dep-tracker-darwin-amd64
            dist/dep-tracker-darwin-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
