name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: go build ./cmd/dep-tracker
      - run: bash -n scripts/install.sh scripts/build-release.sh
      - run: bash scripts/test-install.sh
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer and PATH configuration
        shell: pwsh
        run: ./scripts/test-install.ps1
