name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.1.4'

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the release tag to match appVersion
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
        run: |
          version=$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' cmd/dep-tracker/main.go)
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "Release tag '$TAG' does not match appVersion '$version' in cmd/dep-tracker/main.go." >&2
            echo "Update appVersion before tagging, or the binaries report the wrong version and 'update' loops." >&2
            exit 1
          fi

  native-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_NPM_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require full statement coverage
        run: |
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/coverage.out" ./...
          bash scripts/check-coverage.sh "$RUNNER_TEMP/coverage.out"
      - run: go vet ./...
      - run: bash scripts/test-install.sh
      - name: Build and run native executable
        run: |
          go build -o "$RUNNER_TEMP/dep-tracker" ./cmd/dep-tracker
          "$RUNNER_TEMP/dep-tracker" version

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer and PATH configuration
        shell: pwsh
        run: ./scripts/test-install.ps1

  build-and-release:
    name: Build & Publish Release
    needs: [version-check, windows-installer, native-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build with the same Go version that the validation jobs tested.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build standalone binaries
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
