name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.8'

permissions:
  contents: write

jobs:
  native-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_NPM_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/test-install.sh
      - name: Build and run native executable
        run: |
          go build -o "$RUNNER_TEMP/dep-tracker" ./cmd/dep-tracker
          "$RUNNER_TEMP/dep-tracker" version

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer and PATH configuration
        shell: pwsh
        run: ./scripts/test-install.ps1

  build-and-release:
    name: Build & Publish Release
    needs: [windows-installer, native-validation]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build standalone binaries
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
