name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.7'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer and PATH configuration
        shell: pwsh
        run: ./scripts/test-install.ps1

  build-and-release:
    name: Build & Publish Release
    needs: windows-installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
          bash scripts/test-install.sh

      - name: Build standalone binaries
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
