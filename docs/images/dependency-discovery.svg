<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">How dep-tracker discovers dependencies</title>
  <desc id="desc">Four discovery steps (walk the tree, parse dependency files, inspect installed environments, scan source imports) produce packages whose version source decides whether they are checked against OSV or reported as unresolved.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .step { font-size: 15px; font-weight: 700; }
      .text { font-size: 12.5px; fill: #475569; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .chip { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #0f172a; }
      .label { font-size: 13.5px; font-weight: 600; }
      .result { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .result-sub { font-size: 12px; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="560" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="title" x="32" y="46">Dependency discovery</text>
  <text class="subtitle" x="32" y="72">Each step only fills gaps the previous ones left, and every package records where its version came from</text>

  <!-- Steps -->
  <g>
    <rect x="32" y="100" width="282" height="176" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="58" cy="128" r="12" fill="#2563eb"/>
    <text class="num" x="58" y="133" text-anchor="middle">1</text>
    <text class="step" x="78" y="133">Walk the project tree</text>
    <text class="text" x="48" y="164">Skips VCS data, installed packages</text>
    <text class="text" x="48" y="183">and test fixtures</text>
    <text class="text" x="48" y="210">build/, dist/, target/, bin/ are skipped</text>
    <text class="text" x="48" y="229">only beside a dependency file</text>
    <text class="text" x="48" y="256">Virtual environments found by pyvenv.cfg</text>
  </g>
  <g>
    <rect x="340" y="100" width="282" height="176" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="366" cy="128" r="12" fill="#2563eb"/>
    <text class="num" x="366" y="133" text-anchor="middle">2</text>
    <text class="step" x="386" y="133">Parse dependency files</text>
    <text class="text" x="356" y="164">Lockfile preferred per ecosystem and</text>
    <text class="text" x="356" y="183">directory (go.mod over go.sum)</text>
    <text class="text" x="356" y="210">Applies go.mod replace, npm aliases,</text>
    <text class="text" x="356" y="229">Cargo renames, Maven managed versions,</text>
    <text class="text" x="356" y="248">requirements -r includes and hashes</text>
  </g>
  <g>
    <rect x="648" y="100" width="282" height="176" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="674" cy="128" r="12" fill="#2563eb"/>
    <text class="num" x="674" y="133" text-anchor="middle">3</text>
    <text class="step" x="694" y="133">Inspect installed packages</text>
    <text class="text" x="664" y="164">venv, node_modules, vendor/, obj/,</text>
    <text class="text" x="664" y="183">vcpkg_installed, .dart_tool</text>
    <text class="text" x="664" y="210">Read only where no lockfile exists</text>
    <text class="text" x="664" y="237">The installed version replaces a</text>
    <text class="text" x="664" y="256">declared range or mismatched pin</text>
  </g>
  <g>
    <rect x="956" y="100" width="292" height="176" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="982" cy="128" r="12" fill="#2563eb"/>
    <text class="num" x="982" y="133" text-anchor="middle">4</text>
    <text class="step" x="1002" y="133">Scan source-code imports</text>
    <text class="text" x="972" y="164">Only for languages that steps 2 and 3</text>
    <text class="text" x="972" y="183">did not cover in that folder</text>
    <text class="text" x="972" y="210">Ignores the standard library and the</text>
    <text class="text" x="972" y="229">project's own modules</text>
    <text class="text" x="972" y="256">Maps names, e.g. cv2 → opencv-python</text>
  </g>
  <line x1="314" y1="188" x2="336" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="622" y1="188" x2="644" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="188" x2="952" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Funnel into version sources -->
  <path d="M640 276 L640 316" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text class="label" x="656" y="302">Every package carries a version source</text>

  <rect x="32" y="326" width="1216" height="144" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- Exact sources -->
  <text class="label" x="56" y="358">Exact version</text>
  <rect x="56" y="374" width="104" height="32" rx="16" fill="#ffffff" stroke="#86efac"/>
  <text class="chip" x="108" y="395" text-anchor="middle">lockfile</text>
  <rect x="172" y="374" width="104" height="32" rx="16" fill="#ffffff" stroke="#86efac"/>
  <text class="chip" x="224" y="395" text-anchor="middle">installed</text>
  <rect x="288" y="374" width="104" height="32" rx="16" fill="#ffffff" stroke="#86efac"/>
  <text class="chip" x="340" y="395" text-anchor="middle">manifest</text>
  <text class="text" x="56" y="430">A manifest counts only for an exact pin (==1.2.3, =1.2.3)</text>
  <line x1="412" y1="390" x2="470" y2="390" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="476" y="364" width="200" height="54" rx="10" fill="#16a34a"/>
  <text class="result" x="576" y="387" text-anchor="middle">Checked</text>
  <text class="result-sub" x="576" y="405" text-anchor="middle">OSV, NVD, KEV, EPSS</text>

  <!-- Unresolved sources -->
  <text class="label" x="720" y="358">Version not known</text>
  <rect x="720" y="374" width="112" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="chip" x="776" y="395" text-anchor="middle">constraint</text>
  <rect x="844" y="374" width="88" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="chip" x="888" y="395" text-anchor="middle">import</text>
  <text class="text" x="720" y="430">Ranges (^1.2, &gt;=2.0) and bare imports are never</text>
  <text class="text" x="720" y="449">replaced by the latest registry version</text>
  <line x1="944" y1="390" x2="1002" y2="390" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1008" y="364" width="220" height="54" rx="10" fill="#64748b"/>
  <text class="result" x="1118" y="387" text-anchor="middle">Unresolved</text>
  <text class="result-sub" x="1118" y="405" text-anchor="middle">reported, scan exits 2</text>

  <line x1="696" y1="346" x2="696" y2="450" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Error handling -->
  <rect x="32" y="488" width="1216" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="52" y="517">Unreadable folder or malformed manifest:</text>
  <text class="text" x="326" y="517">reported with its path; every readable dependency is still checked, and the scan exits 2 instead of looking clean.</text>
</svg>
