<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <title id="title">dep-tracker system architecture</title>
  <desc id="desc">A scan target passes through four stages: dependency discovery in three layers, vulnerability and maintenance intelligence, risk scoring, and reporting with exit codes. Local caches support the intelligence stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .panel-title { font-size: 15px; font-weight: 700; }
      .card-title { font-size: 13.5px; font-weight: 600; }
      .card-text { font-size: 12.5px; fill: #475569; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .tier { font-size: 11.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.2px; }
      .small { font-size: 12px; fill: #475569; }
      .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="650" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="649" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="title" x="32" y="46">dep-tracker architecture</text>
  <text class="subtitle" x="32" y="72">From a project folder to prioritised findings, an SBOM, a SARIF report and a CI exit code</text>

  <!-- Input -->
  <rect x="32" y="250" width="150" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="panel-title" x="107" y="286" text-anchor="middle">Scan target</text>
  <text class="card-text" x="107" y="314" text-anchor="middle">Project folder</text>
  <text class="card-text" x="107" y="332" text-anchor="middle">(recursive)</text>
  <text class="card-text" x="107" y="356" text-anchor="middle">or one manifest</text>
  <text class="card-text" x="107" y="374" text-anchor="middle">or lockfile</text>

  <!-- 1 Discovery -->
  <rect x="214" y="100" width="300" height="444" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="240" cy="126" r="12" fill="#2563eb"/>
  <text class="num" x="240" y="131" text-anchor="middle">1</text>
  <text class="panel-title" x="260" y="131">Discover dependencies</text>

  <rect x="230" y="150" width="268" height="80" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="card-title" x="246" y="174">Layer 1 · Manifests &amp; lockfiles</text>
  <text class="card-text" x="246" y="196">30+ formats across 12 ecosystems</text>
  <text class="card-text" x="246" y="215">Lockfile wins over manifest</text>

  <rect x="230" y="242" width="268" height="80" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="card-title" x="246" y="266">Layer 2 · Installed environments</text>
  <text class="card-text" x="246" y="288">venv, node_modules, vendor, obj, …</text>
  <text class="card-text" x="246" y="307">Installed version wins</text>

  <rect x="230" y="334" width="268" height="80" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="card-title" x="246" y="358">Layer 3 · Source-code imports</text>
  <text class="card-text" x="246" y="380">10 languages, used where nothing</text>
  <text class="card-text" x="246" y="399">else covers that language</text>

  <rect x="230" y="426" width="268" height="104" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="card-title" x="246" y="450">Resolve &amp; de-duplicate</text>
  <text class="card-text" x="246" y="472">Scoped per project in monorepos</text>
  <text class="card-text" x="246" y="491">Exact versions → checked</text>
  <text class="card-text" x="246" y="510">Ranges &amp; imports → unresolved</text>

  <!-- 2 Intelligence -->
  <rect x="546" y="100" width="310" height="444" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <circle cx="572" cy="126" r="12" fill="#7c3aed"/>
  <text class="num" x="572" y="131" text-anchor="middle">2</text>
  <text class="panel-title" x="592" y="131">Gather intelligence</text>

  <rect x="562" y="150" width="278" height="88" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="card-title" x="578" y="174">Advisories · OSV.dev</text>
  <text class="card-text" x="578" y="196">Batch query, 1,000 packages per call</text>
  <text class="card-text" x="578" y="215">Aliased advisories merged; fixed</text>
  <text class="card-text" x="578" y="232">releases chosen per affected range</text>

  <rect x="562" y="248" width="278" height="88" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="card-title" x="578" y="272">Severity</text>
  <text class="card-text" x="578" y="294">CVSS v3.1 computed locally,</text>
  <text class="card-text" x="578" y="313">then NVD (rate-paced, cached),</text>
  <text class="card-text" x="578" y="330">then the advisory's own rating</text>

  <rect x="562" y="346" width="278" height="88" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="card-title" x="578" y="370">Exploitability</text>
  <text class="card-text" x="578" y="392">CISA Known Exploited</text>
  <text class="card-text" x="578" y="411">Vulnerabilities catalog</text>
  <text class="card-text" x="578" y="428">FIRST EPSS 30-day probability</text>

  <rect x="562" y="444" width="278" height="86" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="card-title" x="578" y="468">Maintenance</text>
  <text class="card-text" x="578" y="490">Release dates from 11 registries</text>
  <text class="card-text" x="578" y="509">Stale: no stable release in 2 years</text>

  <!-- 3 Scoring -->
  <rect x="888" y="100" width="160" height="444" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="914" cy="126" r="12" fill="#d97706"/>
  <text class="num" x="914" y="131" text-anchor="middle">3</text>
  <text class="panel-title" x="934" y="131">Score risk</text>

  <rect x="900" y="152" width="136" height="30" rx="15" fill="#b91c1c"/>
  <text class="tier" x="968" y="171" text-anchor="middle" style="font-size:10px">CRITICAL-EXPLOITABLE</text>
  <rect x="900" y="192" width="136" height="30" rx="15" fill="#ea580c"/>
  <text class="tier" x="968" y="211" text-anchor="middle">HIGH</text>
  <rect x="900" y="232" width="136" height="30" rx="15" fill="#ca8a04"/>
  <text class="tier" x="968" y="251" text-anchor="middle">MEDIUM</text>
  <rect x="900" y="272" width="136" height="30" rx="15" fill="#2563eb"/>
  <text class="tier" x="968" y="291" text-anchor="middle">LOW</text>
  <rect x="900" y="312" width="136" height="30" rx="15" fill="#16a34a"/>
  <text class="tier" x="968" y="331" text-anchor="middle">NONE</text>
  <rect x="900" y="352" width="136" height="30" rx="15" fill="#64748b"/>
  <text class="tier" x="968" y="371" text-anchor="middle">UNKNOWN</text>

  <text class="small" x="968" y="420" text-anchor="middle">KEV, or CVSS ≥ 7</text>
  <text class="small" x="968" y="438" text-anchor="middle">with EPSS ≥ 0.20,</text>
  <text class="small" x="968" y="456" text-anchor="middle">is critical-exploitable</text>
  <text class="small" x="968" y="490" text-anchor="middle">The worst advisory</text>
  <text class="small" x="968" y="508" text-anchor="middle">sets the package tier</text>

  <!-- 4 Reporting -->
  <rect x="1080" y="100" width="168" height="444" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="1106" cy="126" r="12" fill="#059669"/>
  <text class="num" x="1106" y="131" text-anchor="middle">4</text>
  <text class="panel-title" x="1126" y="131">Report</text>

  <rect x="1092" y="152" width="144" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text class="card-title" x="1164" y="173" text-anchor="middle">Terminal report</text>
  <text class="card-text" x="1164" y="191" text-anchor="middle">with fixed releases</text>
  <rect x="1092" y="210" width="144" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text class="card-title" x="1164" y="231" text-anchor="middle">JSON</text>
  <text class="card-text" x="1164" y="249" text-anchor="middle">--json for pipelines</text>
  <rect x="1092" y="268" width="144" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text class="card-title" x="1164" y="289" text-anchor="middle">CycloneDX 1.4</text>
  <text class="card-text" x="1164" y="307" text-anchor="middle">sbom.json</text>
  <rect x="1092" y="326" width="144" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text class="card-title" x="1164" y="347" text-anchor="middle">SARIF 2.1.0</text>
  <text class="card-text" x="1164" y="365" text-anchor="middle">GitHub code scanning</text>

  <rect x="1092" y="396" width="144" height="134" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text class="card-title" x="1104" y="420">CI exit code</text>
  <text class="mono" x="1104" y="447">0</text>
  <text class="card-text" x="1122" y="447">clean</text>
  <text class="mono" x="1104" y="473">1</text>
  <text class="card-text" x="1122" y="473">critical-</text>
  <text class="card-text" x="1122" y="490">exploitable</text>
  <text class="mono" x="1104" y="516">2</text>
  <text class="card-text" x="1122" y="516">incomplete</text>

  <!-- Flow arrows -->
  <line x1="182" y1="320" x2="210" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="514" y1="320" x2="542" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="856" y1="320" x2="884" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1048" y1="320" x2="1076" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caches -->
  <rect x="546" y="566" width="310" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text class="card-title" x="562" y="590">Local caches</text>
  <text class="card-text" x="562" y="610">NVD 24 h · registries 12 h · CISA KEV</text>
  <line x1="701" y1="566" x2="701" y2="548" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="small" x="872" y="598">Cache location: DEP_TRACKER_CACHE_DIR, or the user cache folder</text>
</svg>
